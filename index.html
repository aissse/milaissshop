<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>milaisss — кроссовки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#141414;
    --stone:#f4f1ec;
    --line:#e7e2d9;
    --orange:#ff5a1f;
    --orange-dark:#e14e17;
    --muted:#8a8479;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--stone);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    overflow-x:hidden;
    padding-bottom:84px;
  }
  .display{ font-family:'Space Grotesk',sans-serif; }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:18px 20px 8px;
  }
  .topbar .greet{ flex:1; }
  .topbar .greet p{ font-size:12px; color:var(--muted); }
  .topbar .greet h1{ font-family:'Space Grotesk'; font-size:20px; font-weight:700; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--stone); display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); cursor:pointer;
  }

  /* Search */
  .search-row{ display:flex; gap:8px; padding:8px 20px 16px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--stone); border:1px solid var(--line);
    border-radius:14px; padding:11px 14px;
  }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-size:14px; width:100%; font-family:'Inter';
  }

  /* Categories */
  .cats{
    display:flex; gap:8px; padding:0 20px 18px;
    overflow-x:auto; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:9px 16px; border-radius:100px;
    font-size:13px; font-weight:600; white-space:nowrap;
    background:var(--stone); border:1px solid var(--line); color:var(--ink);
    cursor:pointer;
  }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* Hero */
  .hero{
    margin:0 20px 22px; border-radius:20px;
    background:linear-gradient(135deg,#1a1a1a 0%,#2b2b2b 100%);
    color:#fff; padding:22px 20px; position:relative; overflow:hidden;
    min-height:130px; display:flex; align-items:center;
  }
  .hero::after{
    content:""; position:absolute; right:-30px; bottom:-40px;
    width:160px; height:160px; border-radius:50%;
    background:var(--orange); opacity:0.35; filter:blur(30px);
  }
  .hero-text{ position:relative; z-index:2; max-width:62%; }
  .hero-text .tag{ font-size:11px; color:var(--orange); font-weight:700; letter-spacing:.02em; }
  .hero-text h2{ font-family:'Space Grotesk'; font-size:19px; margin:6px 0 12px; line-height:1.25; }
  .hero-btn{
    background:var(--orange); color:#fff; border:none; padding:9px 16px;
    border-radius:100px; font-size:12px; font-weight:700; cursor:pointer;
  }

  /* Section heading */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 20px; margin-bottom:12px;
  }
  .section-head h3{ font-family:'Space Grotesk'; font-size:17px; }
  .section-head span{ font-size:12px; color:var(--muted); }

  /* Product grid */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    padding:0 20px 26px;
  }
  .card{
    background:var(--bg); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; cursor:pointer; position:relative;
  }
  .card .imgwrap{
    background:var(--stone); aspect-ratio:1/0.9;
    display:flex; align-items:center; justify-content:center;
    font-size:44px; position:relative;
  }
  .heart{
    position:absolute; top:10px; right:10px; width:28px; height:28px;
    border-radius:50%; background:rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .card .info{ padding:10px 12px 14px; }
  .card .name{ font-size:13px; font-weight:600; line-height:1.3; margin-bottom:2px; }
  .card .sub{ font-size:11px; color:var(--muted); margin-bottom:8px; }
  .card .price{ font-family:'Space Grotesk'; font-weight:700; font-size:15px; }

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px;
    max-width:440px; width:calc(100% - 40px);
    background:var(--ink); border-radius:100px;
    display:flex; justify-content:space-around; padding:12px 10px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
    z-index:50;
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:#8a8a8a; font-size:10px; cursor:pointer; position:relative;
  }
  .navitem.active{ color:#fff; }
  .cart-badge{
    position:absolute; top:-6px; right:-8px; background:var(--orange); color:#fff;
    font-size:9px; font-weight:700; width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  /* Screens */
  .screen{ display:none; }
  .screen.active{ display:block; }

  .detail-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
  }
  .detail-img{
    margin:0 20px; border-radius:22px; background:var(--stone);
    aspect-ratio:1/0.85; display:flex; align-items:center; justify-content:center;
    font-size:110px;
  }
  .dots{ display:flex; gap:6px; justify-content:center; margin:14px 0; }
  .dots span{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .dots span.on{ background:var(--ink); }

  .detail-body{ padding:0 20px; }
  .detail-body .rowtop{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .detail-body h2{ font-family:'Space Grotesk'; font-size:21px; line-height:1.3; }
  .detail-body .p{ font-family:'Space Grotesk'; font-size:22px; font-weight:700; white-space:nowrap; }
  .rating{ font-size:12px; color:var(--muted); margin-top:6px; }

  .block-label{ font-size:12px; font-weight:700; margin:20px 0 10px; color:var(--muted); }
  .sizes{ display:flex; gap:8px; flex-wrap:wrap; }
  .size-pill{
    width:44px; height:40px; border-radius:12px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
    cursor:pointer; background:var(--bg);
  }
  .size-pill.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .colors{ display:flex; gap:10px; }
  .color-dot{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; position:relative; }
  .color-dot.active{ border-color:var(--ink); }

  .desc{ font-size:13px; line-height:1.6; color:#555; margin-top:6px; }

  .buybar{ display:flex; gap:10px; padding:18px 20px 28px; }
  .qty-btn{
    width:52px; height:52px; border-radius:16px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--bg);
  }
  .add-btn{
    flex:1; background:var(--orange); color:#fff; border:none; border-radius:16px;
    font-weight:700; font-size:15px; cursor:pointer;
  }

  .back-circle{
    width:38px; height:38px; border-radius:50%; background:var(--stone);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* Cart */
  .cart-title{ padding:18px 20px 6px; }
  .cart-title h2{ font-family:'Space Grotesk'; font-size:21px; }
  .cart-list{ padding:10px 20px; display:flex; flex-direction:column; gap:12px; }
  .cart-item{
    display:flex; gap:12px; border:1px solid var(--line); border-radius:16px; padding:12px;
  }
  .cart-item .thumb{
    width:56px; height:56px; border-radius:12px; background:var(--stone);
    display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;
  }
  .cart-item .meta{ flex:1; }
  .cart-item .meta .name{ font-size:13px; font-weight:600; }
  .cart-item .meta .opts{ font-size:11px; color:var(--muted); margin:2px 0 6px; }
  .cart-item .meta .price{ font-family:'Space Grotesk'; font-weight:700; font-size:14px; }
  .cart-item .remove{ align-self:flex-start; color:var(--muted); font-size:12px; cursor:pointer; }
  .cart-empty{ padding:60px 20px; text-align:center; color:var(--muted); font-size:13px; }

  .cart-summary{ padding:16px 20px 4px; }
  .sum-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; color:#555; }
  .sum-row.total{ font-family:'Space Grotesk'; font-size:17px; font-weight:700; color:var(--ink); }
  .checkout-btn{
    width:calc(100% - 40px); margin:14px 20px 24px; background:var(--orange); color:#fff;
    border:none; border-radius:16px; padding:16px; font-weight:700; font-size:15px; cursor:pointer;
  }
  .hint{ padding:0 20px 20px; font-size:11px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== HOME ===== -->
  <div class="screen active" id="home">
    <div class="topbar">
      <div class="greet">
        <p>Привет 👋</p>
        <h1 class="display">milaisss</h1>
      </div>
      <div class="icon-btn">🔔</div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Найти кроссовки">
      </div>
      <div class="icon-btn">⚙️</div>
    </div>

    <div class="cats">
      <div class="chip active">Тренды</div>
      <div class="chip">Oversize</div>
      <div class="chip">До 500 000</div>
      <div class="chip">Минимализм</div>
      <div class="chip">Лимитки</div>
    </div>

    <div class="hero">
      <div class="hero-text">
        <div class="tag">НОВАЯ КОЛЛЕКЦИЯ</div>
        <h2 class="display">Скидка 20% на первый дроп</h2>
        <button class="hero-btn">Смотреть</button>
      </div>
    </div>

    <div class="section-head">
      <h3 class="display">Популярное 🔥</h3>
      <span>Все</span>
    </div>

    <div class="grid" id="productGrid"></div>
  </div>

  <!-- ===== PRODUCT DETAIL ===== -->
  <div class="screen" id="detail">
    <div class="detail-top">
      <div class="back-circle" onclick="showScreen('home')">←</div>
      <div class="back-circle">♡</div>
    </div>
    <div class="detail-img" id="detailImg"></div>
    <div class="dots"><span class="on"></span><span></span><span></span></div>

    <div class="detail-body">
      <div class="rowtop">
        <div>
          <h2 class="display" id="detailName"></h2>
          <div class="rating">★ 4.8 · 1 200+ отзывов</div>
        </div>
        <div class="p" id="detailPrice"></div>
      </div>

      <div class="block-label">Размер</div>
      <div class="sizes" id="sizeRow"></div>

      <div class="block-label">Цвет</div>
      <div class="colors" id="colorRow"></div>

      <div class="block-label">Описание</div>
      <p class="desc" id="detailDesc"></p>
    </div>

    <div class="buybar">
      <div class="qty-btn">+</div>
      <button class="add-btn" onclick="addToCart()">Добавить в корзину</button>
    </div>
  </div>

  <!-- ===== CART ===== -->
  <div class="screen" id="cart">
    <div class="detail-top">
      <div class="back-circle" onclick="showScreen('home')">←</div>
      <div></div>
    </div>
    <div class="cart-title"><h2 class="display">Корзина</h2></div>

    <div id="cartContent"></div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <div class="bottomnav">
    <div class="navitem active" data-screen="home" onclick="showScreen('home')"><span>🏠</span><span>Главная</span></div>
    <div class="navitem"><span>♡</span><span>Избранное</span></div>
    <div class="navitem" data-screen="cart" style="position:relative;" onclick="showScreen('cart')">
      <span>🛍️</span><span>Корзина</span>
      <span class="cart-badge" id="cartCount">0</span>
    </div>
    <div class="navitem"><span>👤</span><span>Профиль</span></div>
  </div>

</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// Куда будет уходить готовый текст заказа — поменяй на свой юзернейм без @
const ADMIN_USERNAME = "isssroilov";

const products = [
  {emoji:"👟", name:"Nike Dunk Low Panda", sub:"Best collection", price:250000, colors:[{hex:"#c0392b",name:"Красный"},{hex:"#d8c9a3",name:"Бежевый"},{hex:"#3a6b7a",name:"Синий"}], desc:"Культовая расцветка Dunk Low в чёрно-белом сочетании. Верх из натуральной и искусственной кожи."},
  {emoji:"🥿", name:"Low Panda Multivers", sub:"Limited drop", price:310000, colors:[{hex:"#e07a3f",name:"Оранжевый"},{hex:"#1a1a1a",name:"Чёрный"},{hex:"#8a8479",name:"Серый"}], desc:"Смелая многоцветная модель с акцентными вставками, лёгкая подошва для города."},
  {emoji:"👞", name:"Jordan 4 Fire Red", sub:"Retro", price:420000, colors:[{hex:"#c0392b",name:"Красный"},{hex:"#1a1a1a",name:"Чёрный"}], desc:"Ретро-силуэт с фирменной сеткой и амортизацией Air — для тех, кто ценит классику."},
  {emoji:"🩴", name:"Air Force Oversized", sub:"Best seller", price:280000, colors:[{hex:"#f4f1ec",name:"Белый"},{hex:"#8a8479",name:"Серый"},{hex:"#1a1a1a",name:"Чёрный"}], desc:"Массивная подошва и чистые линии — универсальная пара под любой образ."},
];

function fmt(n){ return n.toLocaleString('ru-RU') + " сум"; }

const grid = document.getElementById('productGrid');
products.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openProduct(i);
  card.innerHTML = `
    <div class="imgwrap">${p.emoji}<div class="heart">♡</div></div>
    <div class="info">
      <div class="name">${p.name}</div>
      <div class="sub">${p.sub}</div>
      <div class="price">${fmt(p.price)}</div>
    </div>`;
  grid.appendChild(card);
});

let cart = [];
let currentProduct = null;
let selectedSize = "39";
let selectedColorIdx = 0;

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.querySelectorAll('.navitem').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector(`.navitem[data-screen="${name}"]`);
  if (nav) nav.classList.add('active');
  if (name === 'cart') renderCart();
  window.scrollTo(0,0);
}

function openProduct(i){
  currentProduct = products[i];
  selectedSize = "39";
  selectedColorIdx = 0;

  document.getElementById('detailImg').textContent = currentProduct.emoji;
  document.getElementById('detailName').textContent = currentProduct.name;
  document.getElementById('detailPrice').textContent = fmt(currentProduct.price);
  document.getElementById('detailDesc').textContent = currentProduct.desc;

  const sizeRow = document.getElementById('sizeRow');
  sizeRow.innerHTML = '';
  ["38","39","40","41","42","43"].forEach((s) => {
    const el = document.createElement('div');
    el.className = 'size-pill' + (s === selectedSize ? ' active' : '');
    el.textContent = s;
    el.onclick = () => { selectedSize = s; document.querySelectorAll('.size-pill').forEach(x=>x.classList.remove('active')); el.classList.add('active'); };
    sizeRow.appendChild(el);
  });

  const colorRow = document.getElementById('colorRow');
  colorRow.innerHTML = '';
  currentProduct.colors.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'color-dot' + (idx===0 ? ' active' : '');
    el.style.background = c.hex;
    el.title = c.name;
    el.onclick = () => { selectedColorIdx = idx; document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active')); el.classList.add('active'); };
    colorRow.appendChild(el);
  });

  showScreen('detail');
}

function addToCart(){
  const existing = cart.find(c => c.name === currentProduct.name && c.size === selectedSize && c.colorIdx === selectedColorIdx);
  if (existing){
    existing.qty++;
  } else {
    cart.push({
      name: currentProduct.name,
      emoji: currentProduct.emoji,
      price: currentProduct.price,
      size: selectedSize,
      colorIdx: selectedColorIdx,
      colorName: currentProduct.colors[selectedColorIdx].name,
      qty: 1
    });
  }
  updateCartBadge();
  if (tg) tg.HapticFeedback.notificationOccurred('success');
  showScreen('cart');
}

function updateCartBadge(){
  const count = cart.reduce((a,c) => a + c.qty, 0);
  document.getElementById('cartCount').textContent = count;
}

function removeFromCart(idx){
  cart.splice(idx, 1);
  updateCartBadge();
  renderCart();
}

function renderCart(){
  const content = document.getElementById('cartContent');
  if (cart.length === 0){
    content.innerHTML = `<div class="cart-empty">Корзина пуста<br>Загляни в каталог 👟</div>`;
    return;
  }

  let total = 0;
  const itemsHtml = cart.map((item, idx) => {
    total += item.price * item.qty;
    return `
      <div class="cart-item">
        <div class="thumb">${item.emoji}</div>
        <div class="meta">
          <div class="name">${item.name}</div>
          <div class="opts">Размер ${item.size} · ${item.colorName} · ${item.qty} шт</div>
          <div class="price">${fmt(item.price * item.qty)}</div>
        </div>
        <div class="remove" onclick="removeFromCart(${idx})">Убрать</div>
      </div>`;
  }).join('');

  content.innerHTML = `
    <div class="cart-list">${itemsHtml}</div>
    <div class="cart-summary">
      <div class="sum-row"><span>Товары</span><span>${fmt(total)}</span></div>
      <div class="sum-row"><span>Доставка</span><span>По согласованию</span></div>
      <div class="sum-row total"><span>Итого</span><span>${fmt(total)}</span></div>
    </div>
    <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    <div class="hint">Нажимая "Оформить заказ", откроется чат с продавцом — останется только отправить готовое сообщение.</div>
  `;
}

function checkout(){
  if (cart.length === 0) return;
  let total = 0;
  let text = "Здравствуйте! Хочу оформить заказ:\n\n";
  cart.forEach(item => {
    total += item.price * item.qty;
    text += `• ${item.name} — размер ${item.size}, цвет: ${item.colorName}, ${item.qty} шт — ${fmt(item.price * item.qty)}\n`;
  });
  text += `\nИтого: ${fmt(total)}`;

  const url = `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(text)}`;

  if (tg && tg.openTelegramLink){
    tg.openTelegramLink(url);
  } else {
    window.open(url, '_blank');
  }
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
  };
});
</script>
</body>
</html>
