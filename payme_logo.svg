<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="120" fill="transparent"/>
  
  <!-- Payme New Logo Icon & Text Integration -->
  <g transform="translate(10, 10)">
    <!-- The modern Payme arrow/card element -->
    <path d="M 0 25 C 0 11.19 11.19 0 25 0 L 75 0 C 88.81 0 100 11.19 100 25 L 100 75 C 100 88.81 88.81 100 75 100 L 25 100 C 11.19 100 0 88.81 0 75 Z" fill="#00C4D1"/>
    <!-- The dynamic geometric internal line/arrow -->
    <path d="M 30 70 L 50 35 L 70 70 Z" fill="#FFFFFF"/>
    <path d="M 50 35 L 70 70 L 55 70 Z" fill="#FFF200"/>
    
    <!-- Typography "payme" -->
    <text x="120" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="54" fill="#00C4D1">payme</text>
  </g>
</svg>
