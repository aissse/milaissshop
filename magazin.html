<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>mila/isss — магазин</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121214">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="vendor/three.min.js"></script>
<style>
  :root{ --g:#2B2D31; --s:#D9DADC; --y:#FFC93C; --ink:#F3F3F4; --muted:#A7A9AE; --ease:cubic-bezier(.65,.02,.24,1); }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#121214; color:var(--ink); font-family:'Inter',system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #view{ position:fixed; inset:0; touch-action:none; cursor:grab; }
  #view.dragging{ cursor:grabbing; } #view.pointing{ cursor:pointer; }
  canvas{ display:block; width:100%; height:100%; }

  /* значки в 3D-сцене (следуют за точкой в зале) */
  #hs{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  .hs{ position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:7px; border:0; background:none; color:var(--ink); font:inherit; cursor:pointer;
       pointer-events:auto; transform:translate(-50%,-50%); transition:opacity .45s ease; will-change:transform; }
  .hs.off{ opacity:0; pointer-events:none; }
  .hs .dot{ width:52px; height:52px; border-radius:50%; background:rgba(255,201,60,.95); color:var(--g); display:grid; place-items:center; animation:pulse 2.4s infinite; box-shadow:0 8px 22px rgba(0,0,0,.35); }
  .hs .dot svg{ width:26px; height:26px; }
  .hs .lbl{ font-size:12px; font-weight:800; padding:5px 11px; border-radius:20px; background:rgba(20,20,22,.72); color:#fff; white-space:nowrap; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .hs.big .dot{ width:70px; height:70px; } .hs.big .dot svg{ width:32px; height:32px; } .hs.big .lbl{ font-size:14px; padding:7px 15px; }
  @keyframes pulse{ 0%{ box-shadow:0 8px 22px rgba(0,0,0,.35), 0 0 0 0 rgba(255,201,60,.55); } 70%{ box-shadow:0 8px 22px rgba(0,0,0,.35), 0 0 0 18px rgba(255,201,60,0); } 100%{ box-shadow:0 8px 22px rgba(0,0,0,.35), 0 0 0 0 rgba(255,201,60,0); } }

  .pill{ height:42px; min-width:42px; padding:0 14px; border-radius:21px; border:0; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; font-size:14px;
         background:rgba(20,20,22,.62); color:#fff; -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; }
  .pill svg{ width:20px; height:20px; }
  .badge{ min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--y); color:var(--g); font-size:12px; font-weight:800; display:inline-grid; place-items:center; }
  #backBtn{ position:fixed; left:14px; top:calc(12px + env(safe-area-inset-top)); z-index:20; transition:opacity .4s ease; }
  #cartBtn{ position:fixed; right:14px; top:calc(12px + env(safe-area-inset-top)); z-index:20; }
  #backBtn.off{ opacity:0; pointer-events:none; }
  #moreBtn{ position:fixed; right:14px; top:calc(64px + env(safe-area-inset-top)); z-index:16; display:none; }
  #moreBtn.show{ display:inline-flex; }
  .zoneNav{ position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translate(-50%,12px); z-index:15; display:flex; gap:8px; opacity:0; pointer-events:none; transition:opacity .5s ease, transform .5s ease; }
  .zoneNav.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .zoneNav button.act{ background:var(--y); color:var(--g); }
  .hint{ position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%,10px); z-index:15; opacity:0; transition:opacity .5s ease, transform .5s ease;
         background:rgba(20,20,22,.72); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:22px; white-space:nowrap; pointer-events:none; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .hint.show{ opacity:1; transform:translate(-50%,0); }
  .toast{ position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translate(-50%,-10px); z-index:40; background:var(--ink); color:var(--g); font-weight:700; font-size:14px;
          padding:11px 16px; border-radius:14px; opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .shade{ position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); opacity:0; visibility:hidden; transition:opacity .35s ease, visibility 0s linear .35s; }
  .shade.show{ opacity:1; visibility:visible; transition:opacity .35s ease; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:520px; margin:0 auto; max-height:86vh; overflow:auto; background:var(--g); color:var(--ink);
          border-radius:24px 24px 0 0; padding:10px 20px calc(22px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .45s var(--ease); box-shadow:0 -10px 40px rgba(0,0,0,.4); }
  .sheet.show{ transform:none; }
  .grab{ width:40px; height:5px; border-radius:3px; background:#55575D; margin:0 auto 14px; }
  .pv{ width:100%; aspect-ratio:1.25; border-radius:18px; background:var(--s); display:grid; place-items:center; margin-bottom:16px; overflow:hidden; }
  .pv img{ width:100%; height:100%; object-fit:contain; }
  .noimg{ font-size:40px; }
  .pname{ font-size:20px; font-weight:800; } .pprice{ font-size:18px; font-weight:800; color:var(--y); margin:6px 0 14px; }
  .old{ color:var(--muted); text-decoration:line-through; font-size:14px; font-weight:600; margin-left:8px; }
  .muted{ color:var(--muted); font-size:13px; }
  .colors{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px; }
  .cl{ height:36px; padding:0 12px 0 8px; border-radius:18px; border:1px solid #55575D; background:transparent; color:var(--ink); font:inherit; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .cl i{ width:18px; height:18px; border-radius:50%; border:1px solid #D9DADC; } .cl.on{ border-color:var(--y); }
  .sizes{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 18px; }
  .sz{ min-width:48px; height:42px; padding:0 12px; border-radius:12px; border:1px solid #55575D; background:transparent; color:var(--ink); font:inherit; font-weight:700; cursor:pointer; }
  .sz.on{ background:var(--ink); color:var(--g); border-color:var(--ink); }
  .sz:disabled{ color:#7d7f85; border-style:dashed; cursor:not-allowed; }
  .btn{ width:100%; height:54px; border:0; border-radius:16px; background:var(--y); color:var(--g); font:inherit; font-weight:800; font-size:16px; cursor:pointer; }
  .btn:disabled{ background:#55575D; color:#C9CACD; cursor:not-allowed; }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #3D3F45; }
  .row .th{ width:56px; height:56px; border-radius:12px; background:var(--s); display:grid; place-items:center; flex:none; overflow:hidden; }
  .row .th img{ width:100%; height:100%; object-fit:cover; }
  .row .nm{ flex:1; font-weight:700; font-size:14px; } .row .nm small{ display:block; color:var(--muted); font-weight:600; margin-top:3px; }
  .row .pr{ font-weight:800; font-size:14px; white-space:nowrap; }
  .row .rm{ border:0; background:none; color:#FF8A80; font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:6px; }
  .tot{ display:flex; justify-content:space-between; font-weight:800; font-size:18px; margin:16px 0 4px; }
  .ok{ color:#6BD49A; font-size:13px; font-weight:600; margin-bottom:16px; }

  .loader{ position:fixed; inset:0; z-index:50; background:#121214; display:grid; place-items:center; transition:opacity .8s ease; }
  .loader.hide{ opacity:0; pointer-events:none; }
  .loader .bar{ width:120px; height:2px; background:#2B2D31; border-radius:2px; overflow:hidden; margin-top:18px; }
  .loader .bar i{ display:block; height:100%; width:30%; background:var(--y); animation:load 1.1s ease-in-out infinite; }
  .loader .lg{ font-weight:900; font-size:26px; letter-spacing:-.5px; } .loader .lg b{ color:#C4313B; }
  @keyframes load{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(400%); } }
  .nogl{ position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:30px; z-index:60; background:#121214; }
</style>
</head>
<body>
<div class="loader" id="loader"><div style="text-align:center"><div class="lg">mila<b>/</b>isss</div><div class="bar"><i></i></div></div></div>
<div class="nogl" id="nogl"><div><p style="font-weight:700;margin-bottom:12px">Этот браузер не поддерживает 3D-магазин.</p><a href="index.html" style="color:var(--y)">Перейти в каталог</a></div></div>

<div id="view"></div>
<div id="hs">
  <button class="hs big" data-go="enter" data-at="0,1.25,0.35"><span class="dot" data-i="DOOR"></span><span class="lbl">Войти в магазин</span></button>
  <button class="hs" data-go="tops" data-at="-3.9,2.3,-6.2" data-hub="1"><span class="dot" data-i="TEE"></span><span class="lbl">Верхняя одежда</span></button>
  <button class="hs" data-go="bottoms" data-at="-4.2,1.95,-9.2" data-hub="1"><span class="dot" data-i="PANTS"></span><span class="lbl">Нижняя одежда</span></button>
  <button class="hs" data-go="shoes" data-at="4.3,2.6,-7.4" data-hub="1"><span class="dot" data-i="SNEAKER"></span><span class="lbl">Обувь</span></button>
  <button class="hs" data-go="cashier" data-at="0,1.55,-11.4" data-hub="1"><span class="dot" data-i="BAG"></span><span class="lbl">Касса</span></button>
</div>

<button class="pill off" id="backBtn" aria-label="Назад"><span data-i="BACK"></span><span id="backTxt">На улицу</span></button>
<button class="pill" id="cartBtn" aria-label="Корзина"><span data-i="BAG"></span><span class="badge" id="cartN">0</span></button>
<button class="pill" id="moreBtn">Ещё →</button>
<div class="zoneNav" id="zoneNav">
  <button class="pill" data-go="tops">Верх</button><button class="pill" data-go="bottoms">Низ</button><button class="pill" data-go="shoes">Обувь</button><button class="pill" data-go="cashier">Касса</button>
</div>
<div class="hint" id="hint"></div>
<div class="toast" id="toast"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>

<script>
'use strict';
/* =====================================================================
   mila/isss — 3D-магазин. Всё строится кодом (Three.js): фасад, двери,
   зал, вешалки, полки. Товары — из админки, только в наличии.
   Корзина общая с сайтом (localStorage milaisss_cart), оплата — на сайте.
   ===================================================================== */
const ICONS = {
  DOOR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M12 3v18"/><path d="M9.5 12h-1M15.5 12h-1"/></svg>',
  TEE:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c0 1.7-1.8 3-4 3S8 4.7 8 3Z"/></svg>',
  PANTS:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l1 18h-5l-2-11-2 11H5L6 3Z"/><path d="M6 7h12"/></svg>',
  SNEAKER:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16v-5l4-3 3 3 5 1 6 1.5a2 2 0 0 1 2 2V16H2Z"/><path d="M2 16v2h20v-2"/><path d="M9 11l1.5-2M12 12l1.5-2"/></svg>',
  BAG:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5L6 7Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>',
  BACK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
};
document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = ICONS[el.dataset.i] || ''; });

/* ===================== данные: товары из админки ===================== */
const TYPE_ZONE = { top:'tops', set:'tops', bottom:'bottoms', shoes:'shoes' };
const discOf = p => { const d = Number(p && p.discount) || 0; return (d > 0 && d < 100) ? d : 0; };
const effPrice = p => { const d = discOf(p); return d ? Math.round(Number(p.price||0) * (100 - d) / 100 / 100) * 100 : Number(p.price||0); };
const colorsOf = p => (p.colors && p.colors.length) ? p.colors : [{ name:'Стандарт', hex:'#f4f1ec', stock: p.stock || 0 }];
const sizesOf = p => ((p.sizes && p.sizes.length) ? p.sizes : ["38","39","40","41","42","43"]).map(s => (s && typeof s === 'object') ? s.size : s);
function sizeStock(p, c, size){ // то же правило, что на сайте (getSizeStock)
  if (!c) return Number(p.stock || 0);
  if (c.sizeStocks && Object.prototype.hasOwnProperty.call(c.sizeStocks, size)) return Number(c.sizeStocks[size]) || 0;
  if (c.sizeStocks && Object.keys(c.sizeStocks).length) return 0;
  if (typeof c.stock === 'number') return c.stock;
  return Number(p.stock || 0);
}
const inStock = p => colorsOf(p).some(c => sizesOf(p).some(s => sizeStock(p, c, s) > 0));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeUrl = u => /^https:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
function firstImage(p){ const c = colorsOf(p).find(c => c.image || (c.images && c.images[0])); return safeUrl(p.image) || (c && safeUrl(c.image || c.images[0])) || ''; }
const fmt = n => Number(n || 0).toLocaleString('ru-RU').replace(/,/g,' ') + ' сум';
let products = [];

/* ===================== Three.js: основа ===================== */
const view = document.getElementById('view');
let renderer;
try{ renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' }); }
catch(e){ document.getElementById('nogl').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e10);
scene.fog = new THREE.Fog(0x0d0e10, 22, 48);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 80);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ---------- процедурные текстуры (без картинок — чёткие при любом приближении) ---------- */
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function noiseFill(g, w, h, base, amt, seed, blotch){
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const r = rnd(seed);
  if (blotch) for (let i = 0; i < 90; i++){ // мягкие пятна бетона
    const x = r()*w, y = r()*h, rad = 30 + r()*120, a = .012 + r()*.022, dark = r() > .5;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, dark ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad*2, rad*2);
  }
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const n = (r() - .5) * amt; d[i] += n; d[i+1] += n; d[i+2] += n; }
  g.putImageData(img, 0, 0);
}
const TEX = {
  concrete: canvasTex(1024, 1024, (g,w,h) => noiseFill(g, w, h, '#CBC4BA', 14, 7, true), [2, 1]),
  concreteDark: canvasTex(512, 512, (g,w,h) => noiseFill(g, w, h, '#A9A39A', 16, 11, true), [1, 1]),
  floor: canvasTex(1024, 1024, (g,w,h) => {
    noiseFill(g, w, h, '#57575A', 10, 3, true);
    const r = rnd(5), n = 4, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){ g.fillStyle = `rgba(${r()>.5?255:0},${r()>.5?255:0},${r()>.5?255:0},0)`; const v = (r() - .5) * 18; g.fillStyle = v > 0 ? `rgba(255,255,255,${v/255})` : `rgba(0,0,0,${-v/255})`; g.fillRect(i*s, j*s, s, s); }
    g.strokeStyle = 'rgba(25,25,27,.75)'; g.lineWidth = 3;
    for (let i = 0; i <= n; i++){ g.beginPath(); g.moveTo(i*s, 0); g.lineTo(i*s, h); g.stroke(); g.beginPath(); g.moveTo(0, i*s); g.lineTo(w, i*s); g.stroke(); }
  }, [5, 7]),
  stone: canvasTex(1024, 1024, (g,w,h) => {
    noiseFill(g, w, h, '#D3CEC5', 9, 21, false);
    g.strokeStyle = 'rgba(80,72,64,.18)'; g.lineWidth = 2;
    for (let y = 0; y <= h; y += h/4){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    for (let row = 0; row < 4; row++) for (let x = (row % 2) * w/4; x <= w; x += w/2){ g.beginPath(); g.moveTo(x, row*h/4); g.lineTo(x, (row+1)*h/4); g.stroke(); }
  }, [3, 2]),
  pave: canvasTex(1024, 1024, (g,w,h) => {
    noiseFill(g, w, h, '#36373B', 12, 9, true);
    g.strokeStyle = 'rgba(10,10,12,.85)'; g.lineWidth = 4;
    for (let i = 0; i <= 4; i++){ g.beginPath(); g.moveTo(i*w/4, 0); g.lineTo(i*w/4, h); g.stroke(); g.beginPath(); g.moveTo(0, i*h/4); g.lineTo(w, i*h/4); g.stroke(); }
  }, [8, 4]),
  glow: canvasTex(256, 256, (g,w,h) => { const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2); gr.addColorStop(0, 'rgba(255,236,200,1)'); gr.addColorStop(.35, 'rgba(255,224,170,.45)'); gr.addColorStop(1, 'rgba(255,214,160,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }),
  cone: canvasTex(256, 512, (g,w,h) => { // световое пятно спота на стене: яркая «шапка» и мягкий хвост вниз (к краям — ноль)
    g.save(); g.scale(1, 2);
    const gr = g.createRadialGradient(w/2, h*.09, 0, w/2, h*.16, w/2);
    gr.addColorStop(0, 'rgba(255,232,190,.95)'); gr.addColorStop(.3, 'rgba(255,224,176,.42)'); gr.addColorStop(1, 'rgba(255,214,160,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h/2); g.restore();
  })
};
TEX.concrete.colorSpace = TEX.floor.colorSpace = THREE.SRGBColorSpace;

/* ---------- материалы ---------- */
const M = {
  wall: new THREE.MeshStandardMaterial({ map:TEX.concrete, roughness:.92 }),
  floor: new THREE.MeshStandardMaterial({ map:TEX.floor, roughness:.32, metalness:.05 }),
  ceil: new THREE.MeshStandardMaterial({ color:0xBDB7AE, roughness:.95 }),
  stone: new THREE.MeshStandardMaterial({ map:TEX.stone, roughness:.9 }),
  pave: new THREE.MeshStandardMaterial({ map:TEX.pave, roughness:.22, metalness:.1 }),
  black: new THREE.MeshStandardMaterial({ color:0x141415, roughness:.45, metalness:.6 }),
  counter: new THREE.MeshStandardMaterial({ map:TEX.concreteDark, roughness:.8 }),
  shelf: new THREE.MeshStandardMaterial({ color:0xCFC9C0, roughness:.55, emissive:0x2a2520 }),
  led: new THREE.MeshBasicMaterial({ color:0xFFF1D6 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:.05, metalness:0, transmission:0, transparent:true, opacity:.12 }),
  curtain: new THREE.MeshStandardMaterial({ color:0x6E6A65, roughness:1 }),
  fabricDark: new THREE.MeshStandardMaterial({ color:0x2A2A2C, roughness:1 }),
  fabricLight: new THREE.MeshStandardMaterial({ color:0xB8B0A4, roughness:1 }),
  leaf: new THREE.MeshStandardMaterial({ color:0x3E5236, roughness:.9 }),
  pot: new THREE.MeshStandardMaterial({ color:0xD9D4CB, roughness:.85 })
};
const add = (mesh, x, y, z, parent) => { mesh.position.set(x, y, z); (parent || scene).add(mesh); return mesh; };

// материал: фото товара; у обычного фото на белом фоне белое делаем прозрачным (шейдер),
// у PNG без фона — берём прозрачность картинки
function productMat(tex, keyWhite){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{ value:tex }, keyWhite:{ value: keyWhite ? 1 : 0 }, tint:{ value:new THREE.Color(1, .97, .92) } },
    vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader:`uniform sampler2D map; uniform float keyWhite; uniform vec3 tint; varying vec2 vUv;
      void main(){ vec4 c = texture2D(map, vUv);
        float a = c.a;
        if (keyWhite > .5){ float mn = min(c.r, min(c.g, c.b)); float mx = max(c.r, max(c.g, c.b)); a *= 1.0 - smoothstep(.84, .95, mn) * (1.0 - smoothstep(.06, .16, mx - mn)); }
        if (a < .04) discard;
        gl_FragColor = vec4(c.rgb * tint, a);
#include <colorspace_fragment>
      }`,
    transparent:true, side:THREE.DoubleSide, depthWrite:true
  });
}
const loader = new THREE.TextureLoader(); loader.setCrossOrigin('anonymous');
function cardTex(p){ // если фото не загрузилось — аккуратная карточка с названием
  return canvasTex(512, 640, (g, w, h) => {
    g.fillStyle = '#EDEBE7'; g.beginPath(); g.roundRect(8, 8, w - 16, h - 16, 36); g.fill();
    g.fillStyle = '#2B2D31'; g.font = '700 46px Inter, Arial'; g.textAlign = 'center';
    const words = String(p.name || '').split(' '); let line = '', y = h/2 - 30;
    words.forEach(wd => { if (g.measureText(line + wd).width > w - 80){ g.fillText(line, w/2, y); line = ''; y += 56; } line += wd + ' '; }); g.fillText(line, w/2, y);
    g.fillStyle = '#7A4F00'; g.font = '800 40px Inter, Arial'; g.fillText(fmt(effPrice(p)), w/2, y + 80);
  });
}
function loadProductTex(p){
  const png = safeUrl(p.showcaseImage), photo = firstImage(p);
  return new Promise(res => {
    const url = png || photo;
    if (!url) return res({ tex: cardTex(p), key:false });
    loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; res({ tex:t, key:!png }); },
      undefined, () => res({ tex: cardTex(p), key:false }));
  });
}
const pickables = [], swingers = [], itemGroup = new THREE.Group(); scene.add(itemGroup);
const CAP = { tops:8, bottoms:6, shoes:25 }, page = { tops:0, bottoms:0, shoes:0 };
const ofZone = z => products.filter(p => p.zone === z);
const pageOf = z => { const all = ofZone(z), n = Math.max(1, Math.ceil(all.length / CAP[z])); page[z] = Math.min(page[z], n - 1); return all.slice(page[z] * CAP[z], (page[z] + 1) * CAP[z]); };
const texCache = {};
async function placeItems(zones){
  for (const zone of zones){
    // убираем прежние вещи этой зоны
    for (let i = itemGroup.children.length - 1; i >= 0; i--){ const o = itemGroup.children[i]; if (o.userData.zone === zone) itemGroup.remove(o); }
    for (let i = pickables.length - 1; i >= 0; i--) if (pickables[i].userData.zone === zone) pickables.splice(i, 1);
    for (let i = swingers.length - 1; i >= 0; i--) if (swingers[i].zone === zone) swingers.splice(i, 1);
    const list = pageOf(zone);
    const loaded = await Promise.all(list.map(p => texCache[p.id] || (texCache[p.id] = loadProductTex(p))));
    list.forEach((p, i) => {
      const { tex, key } = loaded[i], img = tex.image || {}, aspect = (img.width && img.height) ? img.height / img.width : 1.2;
      if (zone === 'shoes'){
        const per = SHELF.per, row = Math.floor(i / per), k = i % per, gap = (Math.abs(SHELF.z1 - SHELF.z0) - 1) / (per - 1);
        const w = .38, h = Math.min(.4, w * aspect), y = SHELF.ys[SHELF.ys.length - 1 - row] + .018;
        const z = SHELF.z0 - .5 - k * gap;
        const m = plane(w, h, productMat(tex, key)); m.rotation.y = -Math.PI/2;
        m.position.set(SHELF.x - .02, y + h/2, z);
        m.userData = { id:p.id, zone }; itemGroup.add(m); pickables.push(m);
      } else {
        const R = RACKS[zone], n = list.length, span = Math.abs(R.z1 - R.z0) - .5;
        const z = R.z0 - .25 - (n === 1 ? span/2 : i * span / (n - 1));
        const pivot = new THREE.Group(); pivot.position.set(R.x, R.y, z); pivot.userData = { zone };
        const hg = hangerGeo.clone(); hg.position.y = -.01; pivot.add(hg);
        const w = zone === 'tops' ? .5 : .4, h = Math.min(zone === 'tops' ? .75 : 1.05, w * aspect);
        const m = plane(w, h, productMat(tex, key)); m.rotation.y = Math.PI/2;
        m.position.set(.012 + i * .002, -.15 - h/2 + (zone === 'tops' ? .02 : .0), 0);
        m.userData = { id:p.id, zone }; pivot.add(m); pickables.push(m);
        itemGroup.add(pivot); swingers.push({ pivot, zone, a:0, v:0 });
      }
    });
  }
  ui();
}

function narrowFactor(){ const a = innerWidth / innerHeight; return a < 1 ? Math.min(1.9, 1.05 / a) : 1; }
function viewFor(name){
  const v = VIEWS[name], p = new THREE.Vector3(...v.p), t = new THREE.Vector3(...v.t);
  const f = narrowFactor();
  if (name === 'street'){ p.z = 6 + 5.5 * Math.max(1, f * .95); p.y = 1.6 + (f - 1) * .5; t.y = 2.4 + (f - 1) * .2; }
  else if (name === 'hall'){ /* на телефоне — тот же вид, смотрим поворотом */ }
  else if (f > 1 && v.slide){ const dir = p.clone().sub(t).normalize(); p.add(dir.multiplyScalar((f - 1) * .9)); }
  return { p, t };
}

setCam(viewFor('street').p, viewFor('street').t);
const SPEED = window.__FAST ? .12 : 1;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
// сплайн Катмулла–Рома через точки (концы продлены), t 0…1 — плавная траектория без рывков на стыках
function curve(pts){
  const n = pts.length - 1;
  return t => {
    if (n === 0) return pts[0].clone();
    const f = Math.max(0, Math.min(n - 1e-6, t * n)), i = Math.floor(f), u = f - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
    const u2 = u * u, u3 = u2 * u, out = new THREE.Vector3();
    ['x','y','z'].forEach(k => { out[k] = .5 * ((2*p1[k]) + (-p0[k] + p2[k]) * u + (2*p0[k] - 5*p1[k] + 4*p2[k] - p3[k]) * u2 + (-p0[k] + 3*p1[k] - 3*p2[k] + p3[k]) * u3); });
    return out;
  };
}
// плавный пролёт по точкам (кривая), цель взгляда — тоже по кривой
function fly(points, targets, dur){
  return new Promise(res => {
    const pc = curve([camPos.clone(), ...points]), tc = curve([camTgt.clone(), ...targets]);
    const t0 = performance.now(); dur *= SPEED;
    (function step(now){
      const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = ease(k);
      camPos.copy(pc(e)); camTgt.copy(tc(e));
      if (k < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function doors(open, dur){
  return new Promise(res => {
    dur *= SPEED; const t0 = performance.now(), from = doorR.position.x, to = open ? 1.86 : .615;
    (function step(now){ const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = ease(k), x = from + (to - from) * e;
      doorR.position.x = x; doorL.position.x = -x; if (k < 1) requestAnimationFrame(step); else res(); })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const HALL_MID = new THREE.Vector3(0, 1.65, -5.6);

async function go(target){
  if (busy) return; busy = true; hideHint();
  try{
    lookYaw = 0; slideZ = 0;
    if (target === 'enter'){
      state = 'entering'; ui();
      await fly([new THREE.Vector3(0, 1.62, 4.2)], [new THREE.Vector3(0, 1.55, -4)], 1100); // подходим к двери
      await doors(true, 1100);                                                                 // двери разъезжаются
      const d = viewFor('door'), h = viewFor('hall');
      await fly([d.p, h.p], [d.t, h.t], 2100);                                                 // проходим внутрь
      doors(false, 1400);
      state = 'hall'; zone = null; ui();
      hint(innerWidth < 700 ? 'Нажмите на значок или поверните взгляд пальцем' : 'Нажмите на значок — камера подойдёт');
    }
    else if (target === 'street'){
      state = 'leaving'; ui();
      const d = viewFor('door'); await fly([HALL_MID.clone().setZ(-2.5), d.p], [new THREE.Vector3(0, 1.5, 6), new THREE.Vector3(0, 1.5, 8)], 1500);
      await doors(true, 700);
      const s = viewFor('street'); await fly([new THREE.Vector3(0, 1.62, 4.2), s.p], [new THREE.Vector3(0, 1.6, 0), s.t], 1700);
      doors(false, 900); state = 'street'; zone = null; ui();
    }
    else if (target === 'hall'){
      const h = viewFor('hall'); await fly([HALL_MID, h.p], [new THREE.Vector3(0, 1.4, -9), h.t], 1600);
      state = 'hall'; zone = null; ui();
    }
    else if (VIEWS[target]){
      const v = viewFor(target);
      const via = (zone && zone !== target) || state === 'hall' ? [HALL_MID.clone()] : [];
      const viaT = via.length ? [new THREE.Vector3((v.t.x) * .4, 1.4, (v.t.z + camTgt.z) / 2)] : [];
      state = 'moving'; ui();
      await fly([...via, v.p], [...viaT, v.t], via.length ? 2000 : 1500);
      state = 'zone'; zone = target; ui();
      if (target === 'tops' || target === 'bottoms') hint(matchMedia('(hover:hover)').matches ? 'Проведите мышкой по одежде · нажмите — подробнее' : 'Проведите пальцем по одежде · нажмите — подробнее');
      if (target === 'shoes') hint('Нажмите на пару — подробнее');
      if (target === 'cashier') openCheckout();
    }
  } finally { busy = false; ui(); }
}

/* ===================== интерфейс ===================== */
const $ = id => document.getElementById(id);
function ui(){
  const inside = state !== 'street' && state !== 'entering' && state !== 'leaving';
  $('backBtn').classList.toggle('off', !inside || busy);
  $('backTxt').textContent = zone ? 'В зал' : 'На улицу';
  $('zoneNav').classList.toggle('show', inside && !busy);
  document.querySelectorAll('#zoneNav button').forEach(b => b.classList.toggle('act', b.dataset.go === zone));
  document.querySelectorAll('.hs').forEach(h => {
    const show = h.dataset.go === 'enter' ? state === 'street' && !busy : state === 'hall' && !busy;
    h.classList.toggle('off', !show);
  });
  const many = zone && zone !== 'cashier' && ofZone(zone).length > CAP[zone];
  $('moreBtn').classList.toggle('show', !!many && !busy);
  if (many) $('moreBtn').textContent = `Ещё → ${page[zone] + 1}/${Math.ceil(ofZone(zone).length / CAP[zone])}`;
}
let hintT;
function hint(t, ms = 3600){ const h = $('hint'); h.textContent = t; h.classList.add('show'); clearTimeout(hintT); hintT = setTimeout(hideHint, ms); }
function hideHint(){ $('hint').classList.remove('show'); }
let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

/* ===================== жесты ===================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y){ ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const hit = ray.intersectObjects(pickables, false)[0]; return hit ? hit.object : null; }
let drag = null;
view.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, lx:e.clientX, moved:false }; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove', e => {
  const dx = drag ? e.clientX - drag.lx : (e.movementX || 0);
  // «трогаем» одежду: вещь под пальцем/мышкой раскачивается
  if (zone === 'tops' || zone === 'bottoms'){
    const o = pick(e.clientX, e.clientY);
    if (o){ const s = swingers.find(s => s.pivot === o.parent); if (s && dx){ s.v += Math.max(-.06, Math.min(.06, dx * .004)); const i = swingers.indexOf(s); [swingers[i-1], swingers[i+1]].forEach(n => { if (n && n.zone === s.zone) n.v += dx * .0012; }); } }
    view.classList.toggle('pointing', !!o && !drag);
  } else if (zone === 'shoes' && !drag){ view.classList.toggle('pointing', !!pick(e.clientX, e.clientY)); }
  if (!drag) return;
  drag.lx = e.clientX;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8){ drag.moved = true; view.classList.add('dragging'); }
  if (!drag.moved || busy) return;
  if (state === 'hall') lookYaw = Math.max(-1.05, Math.min(1.05, lookYaw + dx * .004));
  else if (state === 'zone' && VIEWS[zone].slide){ const sl = VIEWS[zone].slide, base = VIEWS[zone].p[2]; const sign = zone === 'shoes' ? 1 : -1; slideZ = Math.max(sl[1] - base, Math.min(sl[0] - base, slideZ + sign * dx * .006)); }
});
view.addEventListener('pointerup', e => {
  if (!drag) return; const tap = !drag.moved; drag = null; view.classList.remove('dragging');
  if (!tap || busy) return;
  const o = pick(e.clientX, e.clientY);
  if (o && state === 'zone'){ const s = swingers.find(s => s.pivot === o.parent); if (s) s.v += .05; openProduct(o.userData.id); }
});
view.addEventListener('pointercancel', () => { drag = null; view.classList.remove('dragging'); });
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('backBtn').onclick = () => go(zone ? 'hall' : 'street');
$('cartBtn').onclick = () => (state === 'street' ? openCheckout() : go('cashier'));
$('moreBtn').onclick = () => { if (!zone || zone === 'cashier') return; const n = Math.ceil(ofZone(zone).length / CAP[zone]); page[zone] = (page[zone] + 1) % n; placeItems([zone]); };

/* ===================== кадр ===================== */
const hsEls = [...document.querySelectorAll('.hs')].map(el => ({ el, at:new THREE.Vector3(...el.dataset.at.split(',').map(Number)) }));
const tmpV = new THREE.Vector3(), look = new THREE.Vector3();
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1 ? 62 : 50; camera.updateProjectionMatrix(); if (!busy && state === 'street') setCam(viewFor('street').p, viewFor('street').t); }
addEventListener('resize', resize); resize();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // камера + ручной поворот/сдвиг (мягко)
  camera.position.copy(camPos);
  if (state === 'zone' && slideZ){ camera.position.z += slideZ; }
  look.copy(camTgt); if (state === 'zone' && slideZ) look.z += slideZ;
  if (lookYaw){ const d = look.clone().sub(camera.position); d.applyAxisAngle(new THREE.Vector3(0, 1, 0), -lookYaw); look.copy(camera.position).add(d); }
  camera.lookAt(look);
  // одежда качается (пружина)
  for (const s of swingers){ s.v += -s.a * 9 * dt; s.v *= Math.pow(.25, dt); s.a += s.v * 60 * dt; s.a = Math.max(-.5, Math.min(.5, s.a)); s.pivot.rotation.x = s.a; }
  renderer.render(scene, camera);
  // значки следуют за своими точками
  for (const h of hsEls){
    tmpV.copy(h.at).project(camera);
    const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.15 && Math.abs(tmpV.y) < 1.15;
    h.el.style.transform = `translate(${(tmpV.x * .5 + .5) * innerWidth}px, ${(-tmpV.y * .5 + .5) * innerHeight}px) translate(-50%,-50%)`;
    h.el.style.visibility = vis ? 'visible' : 'hidden';
  }
});

/* ===================== корзина, карточка товара, касса ===================== */
const CART_KEY = 'milaisss_cart';
function readCart(){ try{ const c = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); return Array.isArray(c) ? c.filter(x => x && x.productId && x.qty > 0) : []; }catch(e){ return []; } }
function writeCart(c){ try{ localStorage.setItem(CART_KEY, JSON.stringify(c)); }catch(e){} badge(); }
function badge(){ const n = readCart().reduce((a, c) => a + c.qty, 0); $('cartN').textContent = n > 99 ? '99+' : n; }
addEventListener('storage', e => { if (e.key === CART_KEY) badge(); });
const sheet = $('sheet'), shadeEl = $('shade');
function openSheet(html){ sheet.innerHTML = '<div class="grab"></div>' + html; shadeEl.classList.add('show'); sheet.classList.add('show'); }
function closeSheet(){ shadeEl.classList.remove('show'); sheet.classList.remove('show'); }
shadeEl.addEventListener('click', closeSheet);
function openProduct(id){
  const p = products.find(x => x.id === id); if (!p) return;
  const colors = colorsOf(p), sizes = sizesOf(p);
  let ci = Math.max(0, colors.findIndex(c => sizes.some(s => sizeStock(p, c, s) > 0))), size = '';
  const priceHTML = discOf(p) ? `${fmt(effPrice(p))}<span class="old">${fmt(p.price)}</span>` : fmt(p.price);
  const draw = () => {
    const c = colors[ci], img = safeUrl(c.image || (c.images && c.images[0])) || firstImage(p);
    const colorsHTML = colors.length > 1 ? `<div class="muted">Цвет: ${esc(c.name)}</div><div class="colors">${colors.map((x, i) => `<button class="cl${i === ci ? ' on' : ''}" data-ci="${i}"><i style="background:${esc(x.hex || '#ccc')}"></i>${esc(x.name)}</button>`).join('')}</div>` : '';
    openSheet(`<div class="pv">${img ? `<img src="${esc(img)}" alt="">` : '<div class="noimg">👕</div>'}</div>
      <div class="pname">${esc(p.name)}</div><div class="pprice">${priceHTML}</div>${colorsHTML}
      <div class="muted">Размер</div><div class="sizes">${sizes.map(s => `<button class="sz${s === size ? ' on' : ''}" data-s="${esc(s)}" ${sizeStock(p, c, s) > 0 ? '' : 'disabled'}>${esc(s)}</button>`).join('')}</div>
      <button class="btn" id="addBtn" ${size ? '' : 'disabled'}>${size ? 'Добавить в корзину' : 'Выберите размер'}</button>
      <a href="index.html?product=${encodeURIComponent(p.id)}" class="muted" style="display:block;text-align:center;margin-top:14px;color:var(--muted)">Подробнее о товаре на сайте</a>`);
    sheet.querySelectorAll('.cl').forEach(b => b.onclick = () => { ci = +b.dataset.ci; if (sizeStock(p, colors[ci], size) <= 0) size = ''; draw(); });
    sheet.querySelectorAll('.sz:not(:disabled)').forEach(b => b.onclick = () => { size = b.dataset.s; draw(); });
    $('addBtn').onclick = () => addToCart(p, colors[ci], size);
  };
  draw();
}
function addToCart(p, c, size){
  const limit = sizeStock(p, c, size); if (!size || limit <= 0) return;
  const cart = readCart(), ex = cart.find(x => x.productId === p.id && x.size === size && x.colorName === c.name);
  if (ex){ if (ex.qty >= limit){ toast('Больше нет в наличии'); return; } ex.qty++; }
  else cart.push({ productId:p.id, name:p.name, image: c.image || p.image || '', emoji: p.emoji || '👟', price: effPrice(p), oldPrice: Number(p.price || 0), discount: discOf(p), size, colorName: c.name, qty: 1 });
  writeCart(cart); closeSheet(); toast(`${p.name} (${size}) — в корзине`);
}
function openCheckout(){
  const cart = readCart();
  if (!cart.length){ openSheet(`<div class="pname">Касса</div><p class="muted" style="margin:10px 0 18px">Корзина пока пустая — выберите одежду на вешалках или обувь на полках.</p><button class="btn" id="cBtn">Пойти выбирать</button>`);
    $('cBtn').onclick = () => { closeSheet(); if (state !== 'street') go('hall'); else go('enter'); }; return; }
  const rows = cart.map((c, i) => `<div class="row"><div class="th">${safeUrl(c.image) ? `<img src="${esc(c.image)}" alt="">` : esc(c.emoji || '👟')}</div>
    <div class="nm">${esc(c.name)}<small>${esc(c.colorName || '')}${c.size ? ' · ' + esc(c.size) : ''}${c.qty > 1 ? ' · ' + c.qty + ' шт' : ''}</small></div>
    <div class="pr">${fmt(c.price * c.qty)}</div><button class="rm" data-i="${i}">убрать</button></div>`).join('');
  const sum = cart.reduce((s, c) => s + c.price * c.qty, 0);
  openSheet(`<div class="pname">Касса</div><p class="muted" style="margin:4px 0 6px">Ваши товары</p>${rows}
    <div class="tot"><span>Итого</span><span>${fmt(sum)}</span></div>
    <div class="ok">${sum >= 850000 ? '✓ Бесплатная доставка' : 'До бесплатной доставки: ' + fmt(850000 - sum)}</div>
    <button class="btn" id="payBtn">Оформить и оплатить · Click / Uzum</button>`);
  sheet.querySelectorAll('.rm').forEach(b => b.onclick = () => { const c = readCart(); c.splice(+b.dataset.i, 1); writeCart(c); openCheckout(); });
  $('payBtn').onclick = () => { location.href = 'index.html'; };
}

    firebase.initializeApp({ apiKey:"AIzaSyAPg6nCQ4I9vTKX5AXlmHM5gwYAsrNvW40", authDomain:"milaisss.firebaseapp.com", projectId:"milaisss", storageBucket:"milaisss.firebasestorage.app", messagingSenderId:"785104008182", appId:"1:785104008182:web:25d36e5c69aa7b71050dd7" });
    const snap = await firebase.firestore().collection('products').get();

badge(); ui();
(document.fonts && document.fonts.load ? document.fonts.load('900 100px Inter') : Promise.resolve()).catch(() => {}).then(() => {
  // логотип рисуем, когда шрифт готов
  const fresh = logoTex(); logoMat.map = fresh; logoMat.needsUpdate = true;
});
loadProducts();
setTimeout(() => $('loader').classList.add('hide'), 700);
