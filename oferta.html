let cur = 'ru';
try{ const s = localStorage.getItem('milaisss_lang'); if (s && T[s]) cur = s; }catch(e){}
try{ const q = new URLSearchParams(location.search).get('lang'); if (q && T[q]) cur = q; }catch(e){}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const d = T[cur];
  document.documentElement.lang = cur;
  document.title = d.title + ' — milaisss';
  document.getElementById('ttl').textContent = d.title;
  document.getElementById('meta').textContent = d.ed + EDITION;
  document.getElementById('backLink').textContent = d.back;
  document.getElementById('note').textContent = d.note;
  document.getElementById('langs').innerHTML = Object.keys(LANGS).map(k =>
    `<button class="${k===cur?'on':''}" onclick="setL('${k}')">${LANGS[k]}</button>`).join('');
  let html = d.s.map(([h, ps]) => `<div class="sec"><h2>${esc(h)}</h2>${ps.map(p => `<p>${esc(p)}</p>`).join('')}</div>`).join('');
  const rows = Object.keys(d.rq).filter(k => REQUISITES[k] && String(REQUISITES[k]).trim())
    .map(k => `<p><b>${esc(d.rq[k])}:</b> ${esc(REQUISITES[k])}</p>`).join('');
  if (rows) html += `<div class="sec req"><h2>${esc(d.reqH)}</h2>${rows}</div>`;
  document.getElementById('body').innerHTML = html;
}
function setL(k){ cur = k; try{ localStorage.setItem('milaisss_lang', k); }catch(e){} render(); }
render();
</script>
